<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>数据曲线可视化 - Yu_ToolBox</title>
  <script>
    const savedTheme = localStorage.getItem('toolbox-theme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    const savedLang = localStorage.getItem('toolbox-lang') || 'zh';
    document.documentElement.setAttribute('lang', savedLang === 'zh' ? 'zh-CN' : 'en');
  </script>
  <link rel="icon" href="../asset/Logo/Yu_Tools.png" type="image/png">
  <link rel="stylesheet" href="../asset/CSS/common.css">
  <link rel="stylesheet" href="../asset/CSS/SignalPlotter.css">
</head>
<body>
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="navbar-brand" href="../index.html">
        <div class="brand-icon">
          <img src="../asset/Logo/Yu_Tools.png" width="36" height="36" loading="lazy" alt="Yu_ToolBox">
        </div>
        Yu_ToolBox
      </a>
      <div class="navbar-right">
        <div class="lang-toggle" id="langToggle" title="切换语言 / Switch Language" data-i18n-title="common.lang.title">
          <span class="lang-label">EN</span>
        </div>
        <div class="theme-toggle" id="themeToggle" title="切换主题" data-i18n-title="common.theme.title">
          <span class="theme-icon" id="themeIcon">☀️</span>
          <div class="toggle-track">
            <div class="toggle-thumb"></div>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="page-title" data-i18n="signal.page.title">📈 数据曲线可视化</div>
    <div class="subhead" data-i18n="signal.subhead">🔹 信号绘图 · FFT 变换 · 数字滤波分析工具</div>

    <div class="grid-2col">
      <!-- 数据输入面板 -->
      <div class="panel">
        <div class="panel-title"><span data-i18n="signal.p1.title">数据输入</span> <small data-i18n="signal.p1.small">原始数据或公式生成</small></div>
        <div class="tabs">
          <button class="tab active" data-tab="raw" data-i18n="signal.tab.raw">原始数据</button>
          <button class="tab" data-tab="formula" data-i18n="signal.tab.formula">公式生成</button>
        </div>

        <div class="tab-content active" id="tab-raw">
          <div class="table-toolbar">
            <button class="btn btn-sm btn-outline" style="padding:4px 12px;font-size:0.7rem;" onclick="addTableRow()" data-i18n="signal.btn.addRow">+ 添加行</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 12px;font-size:0.7rem;" onclick="removeTableRow()" data-i18n="signal.btn.delRow">- 删除行</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 12px;font-size:0.7rem;" onclick="clearTable()" data-i18n="signal.btn.clear">清空</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 12px;font-size:0.7rem;" onclick="document.getElementById('fileInput').click()" data-i18n="signal.btn.importCsv">📁 导入 CSV</button>
            <input type="file" id="fileInput" class="file-input" accept=".csv,.txt" onchange="importFile(event)">
            <span style="font-size:0.65rem;color:var(--text-light);" data-i18n="signal.hint.csvFmt">支持 .csv / .txt</span>
          </div>
          <div class="data-table-wrap">
            <table class="data-table" id="dataTable">
              <thead><tr><th>X</th><th>Y</th></tr></thead>
              <tbody id="dataTableBody">
                <tr><td><input type="text" value="0"></td><td><input type="text" value="0"></td></tr>
                <tr><td><input type="text" value="0.01"></td><td><input type="text" value="0.309"></td></tr>
                <tr><td><input type="text" value="0.02"></td><td><input type="text" value="0.588"></td></tr>
                <tr><td><input type="text" value="0.03"></td><td><input type="text" value="0.809"></td></tr>
                <tr><td><input type="text" value="0.04"></td><td><input type="text" value="0.951"></td></tr>
                <tr><td><input type="text" value="0.05"></td><td><input type="text" value="1.0"></td></tr>
                <tr><td><input type="text" value="0.06"></td><td><input type="text" value="0.951"></td></tr>
                <tr><td><input type="text" value="0.07"></td><td><input type="text" value="0.809"></td></tr>
                <tr><td><input type="text" value="0.08"></td><td><input type="text" value="0.588"></td></tr>
                <tr><td><input type="text" value="0.09"></td><td><input type="text" value="0.309"></td></tr>
                <tr><td><input type="text" value="0.1"></td><td><input type="text" value="0.0"></td></tr>
                <tr><td><input type="text" value="0.11"></td><td><input type="text" value="-0.309"></td></tr>
                <tr><td><input type="text" value="0.12"></td><td><input type="text" value="-0.588"></td></tr>
                <tr><td><input type="text" value="0.13"></td><td><input type="text" value="-0.809"></td></tr>
                <tr><td><input type="text" value="0.14"></td><td><input type="text" value="-0.951"></td></tr>
                <tr><td><input type="text" value="0.15"></td><td><input type="text" value="-1.0"></td></tr>
                <tr><td><input type="text" value="0.16"></td><td><input type="text" value="-0.951"></td></tr>
                <tr><td><input type="text" value="0.17"></td><td><input type="text" value="-0.809"></td></tr>
                <tr><td><input type="text" value="0.18"></td><td><input type="text" value="-0.588"></td></tr>
                <tr><td><input type="text" value="0.19"></td><td><input type="text" value="-0.309"></td></tr>
                <tr><td><input type="text" value="0.2"></td><td><input type="text" value="0.0"></td></tr>
              </tbody>
            </table>
          </div>
          <div class="btn-group">
            <button class="btn btn-sm btn-outline" onclick="plotTableData()" data-i18n="signal.btn.plotData">绘制数据</button>
          </div>
        </div>

        <div class="tab-content" id="tab-formula">
          <div class="form-group">
            <label data-i18n="signal.label.formula">公式（使用 x 作为变量）</label>
            <input type="text" id="formulaInput" value="sin(2*PI*x) + 0.5*sin(6*PI*x)" placeholder="例如 sin(2*PI*x)" data-i18n-placeholder="signal.placeholder.formula">
          </div>
          <div class="btn-group" style="margin-bottom:8px;">
            <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:0.7rem;" onclick="setFormula('sin(2*PI*x)')" data-i18n="signal.btn.sine">正弦波</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:0.7rem;" onclick="setFormula('sin(2*PI*x) + 0.5*sin(6*PI*x)')" data-i18n="signal.btn.mixed">混合频率</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:0.7rem;" onclick="setFormula('exp(-x)*sin(4*PI*x)')" data-i18n="signal.btn.decay">衰减振荡</button>
            <button class="btn btn-sm btn-outline" style="padding:4px 10px;font-size:0.7rem;" onclick="setFormula('sin(2*PI*x) + 0.8*(Math.random()-0.5)')" data-i18n="signal.btn.noisy">含噪信号</button>
          </div>
          <div class="row">
            <div class="form-group">
              <label data-i18n="signal.label.xStart">X 起始</label>
              <input type="number" id="xStart" value="0" step="any">
            </div>
            <div class="form-group">
              <label data-i18n="signal.label.xEnd">X 结束</label>
              <input type="number" id="xEnd" value="10" step="any">
            </div>
            <div class="form-group">
              <label data-i18n="signal.label.samples">采样点数</label>
              <input type="number" id="xSamples" value="512" min="2">
            </div>
          </div>
          <div class="btn-group">
            <button class="btn" onclick="plotFormula()" data-i18n="signal.btn.plotFormula">生成并绘制</button>
          </div>
        </div>
      </div>

      <!-- 主图表面板 -->
      <div class="panel">
        <div class="panel-title"><span data-i18n="signal.p2.title">时域波形</span> <small data-i18n="signal.p2.small">原始信号与滤波后信号</small></div>
        <div class="canvas-wrap" id="timeWrap">
          <canvas id="timeCanvas"></canvas>
        </div>
        <div class="tooltip" id="timeTooltip"></div>
        <div class="legend" id="timeLegend">
          <div class="legend-item"><div class="legend-color" style="background:#4f46e5"></div><span data-i18n="signal.legend.original">原始信号</span></div>
          <div class="legend-item"><div class="legend-color" style="background:#10b981"></div><span data-i18n="signal.legend.filtered">滤波后信号</span></div>
        </div>
        <div class="btn-group">
          <button class="btn btn-outline" onclick="resetView('time')" data-i18n="signal.btn.resetView">复位视图</button>
          <button class="btn btn-outline" onclick="exportData('original')" data-i18n="signal.btn.exportOriginal">导出原始 CSV</button>
          <button class="btn btn-outline" onclick="exportData('filtered')" data-i18n="signal.btn.exportFiltered">导出滤波 CSV</button>
        </div>
      </div>

      <!-- FFT 面板 -->
      <div class="panel">
        <div class="panel-title"><span data-i18n="signal.p3.title">FFT 频谱分析</span> <small data-i18n="signal.p3.small">幅度谱</small></div>
        <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:6px;">
          <div class="btn-group" style="margin-top:0;">
            <button class="btn btn-sm btn-outline" onclick="runFFT()" data-i18n="signal.btn.runFft">执行 FFT</button>
            <button class="btn btn-outline" onclick="exportData('fft')" data-i18n="signal.btn.exportFft">导出频谱 CSV</button>
          </div>
          <div class="fft-mode-group">
            <button class="fft-mode-btn active" data-mode="stem" onclick="setFFTMode('stem',this)" data-i18n="signal.fftMode.stem">茎叶图</button>
            <button class="fft-mode-btn" data-mode="bar" onclick="setFFTMode('bar',this)" data-i18n="signal.fftMode.bar">柱状图</button>
            <button class="fft-mode-btn" data-mode="line" onclick="setFFTMode('line',this)" data-i18n="signal.fftMode.line">折线图</button>
          </div>
          <div class="fft-mode-group">
            <button class="fft-mode-btn active" data-yaxis="magnitude" onclick="setFFTAxis('magnitude',this)" data-i18n="signal.fftAxis.magnitude">幅度</button>
            <button class="fft-mode-btn" data-yaxis="dB" onclick="setFFTAxis('dB',this)" data-i18n="signal.fftAxis.dB">dB</button>
          </div>
        </div>
        <div class="canvas-wrap" id="fftWrap">
          <canvas id="fftCanvas"></canvas>
        </div>
        <div class="tooltip" id="fftTooltip"></div>
        <div class="btn-group" style="margin-top:10px;">
          <button class="btn btn-outline" onclick="resetView('fft')" data-i18n="signal.btn.resetView">复位视图</button>
        </div>
        <div class="stats" id="fftStats"></div>
      </div>

      <!-- 滤波器面板 -->
      <div class="panel">
        <div class="panel-title"><span data-i18n="signal.p4.title">数字滤波器</span> <small data-i18n="signal.p4.small">8种常用算法</small></div>
        <div class="form-group">
          <label data-i18n="signal.label.filterAlgo">滤波算法</label>
          <select id="filterAlgo">
            <option value="moving_avg" data-i18n="signal.filter.movingAvg">移动平均滤波</option>
            <option value="median" data-i18n="signal.filter.median">中值滤波</option>
            <option value="amplitude_limit" data-i18n="signal.filter.amplitudeLimit">限幅滤波</option>
            <option value="fir_lowpass" selected data-i18n="signal.filter.firLowpass">低通滤波 (FIR)</option>
            <option value="iir2_lowpass" data-i18n="signal.filter.iir2Lowpass">二阶 IIR 低通滤波</option>
            <option value="kalman" data-i18n="signal.filter.kalman">卡尔曼滤波</option>
            <option value="limit_avg" data-i18n="signal.filter.limitAvg">限幅平均滤波</option>
            <option value="mid_avg" data-i18n="signal.filter.midAvg">中位值平均滤波</option>
          </select>
        </div>
        <div id="firParams">
          <div class="form-group">
            <label data-i18n="signal.label.cutoffHz">截止频率 (Hz)</label>
            <input type="number" id="cutoff1" value="2" step="any" min="0">
          </div>
          <div class="form-group">
            <label data-i18n="signal.label.filterOrder">滤波器阶数</label>
            <input type="number" id="filterOrder" value="32" min="2" max="256">
          </div>
        </div>
        <div id="commonParams">
          <div class="form-group">
            <label id="commonParamLabel" data-i18n="signal.label.windowSize">窗口大小 (点数)</label>
            <input type="number" id="windowSize" value="5" min="2" max="101">
          </div>
        </div>
        <div id="limitParams" style="display:none;">
          <div class="form-group">
            <label data-i18n="signal.label.limitValue">最大偏差限幅值</label>
            <input type="number" id="limitValue" value="0.5" step="any" min="0">
          </div>
        </div>
        <div id="iirParams" style="display:none;">
          <div class="form-group">
            <label data-i18n="signal.label.cutoffHz">截止频率 (Hz)</label>
            <input type="number" id="iirCutoff" value="2" step="any" min="0">
          </div>
        </div>
        <div id="kalmanParams" style="display:none;">
          <div class="row">
            <div class="form-group">
              <label data-i18n="signal.label.kalmanQ">过程噪声 Q</label>
              <input type="number" id="kalmanQ" value="0.01" step="0.001" min="0">
            </div>
            <div class="form-group">
              <label data-i18n="signal.label.kalmanR">测量噪声 R</label>
              <input type="number" id="kalmanR" value="0.1" step="0.001" min="0">
            </div>
          </div>
        </div>
        <div class="btn-group">
          <button class="btn btn-sm btn-outline" onclick="applyFilter()" data-i18n="signal.btn.applyFilter">应用滤波器</button>
          <button class="btn btn-outline" onclick="clearFilter()" data-i18n="signal.btn.clearFilter">清除滤波</button>
        </div>
        <div class="formula-box" id="filterFormula" style="display:none;"></div>
        <div class="stats" id="filterStats"></div>
      </div>
    </div>

    <div class="footer-note">
      <span data-i18n="signal.footer">📈 信号绘图与频谱分析工具 · 支持数据/公式绘图、FFT 频谱分析、多种数字滤波算法</span><br>
      © <script>document.write(new Date().getFullYear())</script> Yu_ToolBox
    </div>
  </div>

  <script src="../asset/JavaScript/theme.js"></script>
  <script src="../asset/JavaScript/i18n.js"></script>
  <script src="../asset/JavaScript/SignalPlotter.js"></script>
</body>
</html>
