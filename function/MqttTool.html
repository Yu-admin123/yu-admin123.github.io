<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MQTT 调试助手</title>
    <link rel="icon" href="../asset/Logo/Yu_Tools.png" type="image/png">
    <script>
        const savedTheme = localStorage.getItem('toolbox-theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        const savedLang = localStorage.getItem('toolbox-lang') || 'zh';
        document.documentElement.setAttribute('lang', savedLang === 'zh' ? 'zh-CN' : 'en');
    </script>
    <script src="https://unpkg.com/mqtt@4.3.7/dist/mqtt.min.js">
    </script>
    <link rel="stylesheet" href="../asset/CSS/common.css">
    <link rel="stylesheet" href="../asset/CSS/MqttTool.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-inner">
            <a class="navbar-brand" href="../index.html">
                <div class="brand-icon">
                    <img src="../asset/Logo/Yu_Tools.png" width="36" height="36" loading="lazy" alt="Yu_ToolBox">
                </div>
                Yu_ToolBox
            </a>
            <div class="navbar-right">
                <!-- 语言切换 -->
                <div class="lang-toggle" id="langToggle" title="切换语言 / Switch Language" data-i18n-title="common.lang.title">
                    <span class="lang-label">EN</span>
                </div>
                <div class="theme-toggle" id="themeToggle" title="切换主题" data-i18n-title="common.theme.title">
                    <span class="theme-icon" id="themeIcon">☀️</span>
                    <div class="toggle-track"><div class="toggle-thumb"></div></div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="page-title" data-i18n="mqtt.page.title">📶 MQTT 调试助手</div>
        <div class="subhead" data-i18n="mqtt.subhead">🔹 基于 MQTT over WebSocket · 支持订阅/发布 · 主题通配符 · 实时消息流</div>

        <div class="grid-2col" style="margin-bottom:18px;">
            <div class="panel panel-accent">
                <div class="panel-title" data-i18n="mqtt.p1.title">① 连接配置</div>
                <div class="input-group">
                    <div class="input-row">
                        <label data-i18n="mqtt.label.protocol">协议</label>
                        <select id="mqttProtocol">
                            <option value="ws">ws (WebSocket)</option>
                            <option value="wss" selected>wss (WebSocket Secure)</option>
                        </select>
                        <span class="hint-text" data-i18n="mqtt.hint.wss">建议使用 wss</span>
                    </div>
                    <div class="input-row">
                        <label>Broker</label>
                        <input type="text" id="mqttHost" value="broker.emqx.io" placeholder="broker.emqx.io" style="flex:1.5;">
                        <label style="min-width:40px;" data-i18n="mqtt.label.port">端口</label>
                        <input type="number" id="mqttPort" value="8084" min="1" max="65535" style="flex:0.5;">
                    </div>
                    <div class="input-row">
                        <label>Client ID</label>
                        <input type="text" id="mqttClientId" value="web_client_xxxx" placeholder="clientId">
                        <button class="btn btn-outline btn-sm" id="genClientIdBtn" data-i18n="mqtt.gen.clientid">随机生成</button>
                    </div>
                    <div class="input-row">
                        <label data-i18n="mqtt.label.username">用户名</label>
                        <input type="text" id="mqttUsername" placeholder="(可选)" data-i18n-placeholder="mqtt.ph.optional" style="flex:1;">
                        <label style="min-width:50px;" data-i18n="mqtt.label.password">密码</label>
                        <input type="password" id="mqttPassword" placeholder="(可选)" data-i18n-placeholder="mqtt.ph.optional" style="flex:1;">
                    </div>
                    <div class="input-row">
                        <label>Keepalive</label>
                        <input type="number" id="mqttKeepalive" value="60" min="1" max="300" style="flex:0.4;">
                        <span class="unit" data-i18n="mqtt.unit.sec">秒</span>
                        <span class="hint-text" data-i18n="mqtt.hint.keepalive">心跳间隔</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-outline" id="connectBtn" data-i18n="mqtt.connect">🔗 连接</button>
                        <button class="btn btn-outline" id="disconnectBtn" disabled data-i18n="mqtt.disconnect">⛔ 断开</button>
                        <button class="btn btn-outline btn-sm" id="reconnectBtn" disabled data-i18n="mqtt.reconnect">🔄 重连</button>
                    </div>
                    <div id="connStatus" style="font-size:0.65rem;color:var(--text-muted);" data-i18n="mqtt.status.not.connected">● 未连接</div>
                </div>
            </div>

            <div class="panel panel-accent">
                <div class="panel-title" data-i18n="mqtt.p2.title">② 订阅管理</div>
                <div class="input-group">
                    <div class="input-row">
                        <label data-i18n="mqtt.label.topic">主题</label>
                        <input type="text" id="subTopic" placeholder="如 test/+ 或 #" data-i18n-placeholder="mqtt.ph.subtopic" style="flex:1.5;">
                        <label style="min-width:40px;">QoS</label>
                        <select id="subQos" style="flex:0.4;">
                            <option value="0">0</option>
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                        </select>
                        <button class="btn btn-outline" id="subBtn" data-i18n="mqtt.subscribe">订阅</button>
                        <button class="btn btn-outline" id="unsubBtn" data-i18n="mqtt.unsubscribe">取消</button>
                    </div>
                    <div class="sub-list" id="subList"></div>
                    <div class="hint-text" style="font-size:0.6rem;" data-i18n="mqtt.hint.sublist">当前订阅的主题列表，点击 ✕ 可取消</div>
                </div>
            </div>
        </div>

        <div class="grid-2col" style="margin-bottom:18px;">
            <div class="panel panel-accent">
                <div class="panel-title" data-i18n="mqtt.p3.title">③ 发布消息</div>
                <div class="input-group">
                    <div class="input-row">
                        <label data-i18n="mqtt.label.topic">主题</label>
                        <input type="text" id="pubTopic" placeholder="test/topic" style="flex:1.5;">
                        <label style="min-width:40px;">QoS</label>
                        <select id="pubQos" style="flex:0.4;">
                            <option value="0">0</option>
                            <option value="1" selected>1</option>
                            <option value="2">2</option>
                        </select>
                        <label style="min-width:50px;" data-i18n="mqtt.label.retain">保留</label>
                        <input type="checkbox" id="pubRetain" style="width:20px;flex:0;">
                    </div>
                    <div class="input-row">
                        <label>Payload</label>
                        <textarea id="pubPayload" rows="3" placeholder="消息内容（支持文本或 JSON）" data-i18n-placeholder="mqtt.ph.payload" style="flex:2;min-height:60px;"></textarea>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-outline" id="pubBtn" data-i18n="mqtt.publish">📤 发布</button>
                        <button class="btn btn-outline" id="clearPubBtn" data-i18n="mqtt.clear">清空</button>
                    </div>
                </div>
            </div>

            <div class="panel panel-accent">
                <div class="panel-title"><span data-i18n="mqtt.p4.title">④ 消息日志</span>
                    <span class="tag" id="logCount">0 条</span>
                    <span class="stat-badge">📥 <span class="num" id="rxCount">0</span></span>
                    <span class="stat-badge">📤 <span class="num" id="txCount">0</span></span>
                </div>
                <div class="code-output" id="logDisplay"><span style="color:var(--text-light);" data-i18n="mqtt.log.waiting">(等待消息...)</span></div>
                <div class="btn-group" style="margin-top:6px;">
                    <button class="btn btn-outline btn-sm" id="clearLogBtn" data-i18n="mqtt.clear.log">清空日志</button>
                    <button class="btn btn-outline btn-sm" id="exportLogBtn" data-i18n="mqtt.export.log">导出日志</button>
                    <label style="font-size:0.65rem;color:var(--text-muted);display:flex;align-items:center;gap:4px;">
                        <input type="checkbox" id="autoScrollLog" checked> <span data-i18n="mqtt.autoscroll">自动滚动</span>
                    </label>
                </div>
            </div>
        </div>

        <div class="footer-note">
            <span data-i18n="mqtt.footer">📶 MQTT 调试助手 · WebSocket MQTT · 支持通配符订阅 · 实时消息流</span><br>
            © <script>document.write(new Date().getFullYear())</script> Yu_ToolBox
        </div>
    </div>

    <script src="../asset/JavaScript/theme.js"></script>
    <script src="../asset/JavaScript/i18n.js"></script>
    <script src="../asset/JavaScript/MqttTool.js"></script>
</body>
</html>
